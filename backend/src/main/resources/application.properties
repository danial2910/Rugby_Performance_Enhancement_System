# ============================================================
#  AI-Powered Rugby Diet & Fitness Planner
#  Spring Boot Application Configuration
# ============================================================

# ── Server ───────────────────────────────────────────────────
server.port=8080

# ── MongoDB ──────────────────────────────────────────────────
# Local dev default: make sure MongoDB is running locally on port 27017.
# In production, set the MONGODB_URI environment variable to your
# MongoDB Atlas connection string — do NOT hardcode it here.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rugby_planner_db}
spring.data.mongodb.database=rugby_planner_db

# Enable @CreatedDate / @LastModifiedDate auto-population
spring.data.mongodb.auto-index-creation=true

# ── JWT ───────────────────────────────────────────────────────
# Secret must be at least 256 bits for HS256.
# No real secret is hardcoded here (this file is committed to git).
# Set the JWT_SECRET environment variable — locally on your machine for dev,
# and on the host (e.g. Render) for production.
app.jwt.secret=${JWT_SECRET:}
# Token expiry: 24 hours in milliseconds
app.jwt.expiration-ms=86400000

# ── CORS ─────────────────────────────────────────────────────
# Local dev default covers the Vite dev server (5173) and CRA-style (3000).
# In production, set CORS_ALLOWED_ORIGINS to your deployed frontend URL(s),
# comma-separated, e.g. https://your-app.vercel.app
# remove http://192.168.1.105:5173 as it only for local testing
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://192.168.1.105:5173}

# ── Frontend URL ───────────────────────────────────────────────
# Used to build links inside emails (e.g. the "View My Appointments" button).
# Local dev default points at the Vite dev server. In production, set
# FRONTEND_URL to your deployed Vercel URL, no trailing slash,
# e.g. https://rugby-performance-enhancement-syste.vercel.app
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ── AI Engine ──────────────────────────────────────────────────
# Groq's free, hosted, OpenAI-compatible chat-completions API is used for
# all AI generation (workout plans, meal plans, chatbot) — both locally and
# in production. Get a free API key from https://console.groq.com and set
# it as the GROQ_API_KEY environment variable (locally on your machine for
# dev, and on the host for production). No local model server required.
groq.api.url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-120b
# Must stay under the model's tokens-per-minute limit (8000 for
# openai/gpt-oss-120b on the free on_demand tier) — Groq counts prompt +
# max_completion_tokens together and returns 413 if the sum exceeds it.
# Groq reserves this whole amount against the per-minute allowance up front, so
# keep it only as large as a plan actually needs: a full 7-day meal plan measures
# ~2500 completion tokens, so 5000 is ample headroom while still leaving room for
# a chatbot turn inside the same minute.
groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:5000}
# Reasoning models (openai/gpt-oss-*) bill hidden reasoning as completion tokens.
# "low" keeps that overhead to ~200 instead of ~900 tokens.
groq.reasoning-effort=${GROQ_REASONING_EFFORT:low}
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:60}

# ── Email (UC010 — appointment notifications via Brevo HTTP API) ─────────────
# Switched from Gmail SMTP to an HTTPS-based email API because free-tier
# Render web services block outbound traffic on SMTP ports (25/465/587) —
# see Render changelog "Free web services will no longer allow outbound
# traffic to SMTP ports". An HTTPS API isn't affected by that block, which is
# why this has gone through a few providers since:
#
# Gmail SMTP → Resend: Resend's free/testing tier only allows sending to the
# account owner's own email until a verified domain is added.
#
# Resend → SendGrid: SendGrid's "free tier" turned out to be a one-time
# 60-day trial, not a perpetual allowance — the dashboard showed
# "End Of Trial — 0 emails/month" and sends failed with "Maximum credits
# exceeded".
#
# SendGrid → Brevo: Brevo's free plan is genuinely free forever — 300
# emails/day, no credit card required — and supports Single Sender
# Verification (Senders, Domains & Dedicated IPs → Senders → Add a Sender →
# verify via a 6-digit code emailed to that inbox) — no domain/DNS needed.
#
# Sign up free at https://www.brevo.com → verify a single sender →
# SMTP & API → API Keys → Generate a new API key.
# No real key is hardcoded here (this file is committed to git).
# Set BREVO_API_KEY as an environment variable — locally on your machine
# for dev, and on the host (e.g. Render) for production.
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=https://api.brevo.com/v3/smtp/email
# Must exactly match the address you verified via Single Sender Verification.
brevo.from-email=${BREVO_FROM_EMAIL:adminpiratesutm@gmail.com}
brevo.from-name=${BREVO_FROM_NAME:Rugby Performance Enhancement System}
# Reply-To address — recipients see the from-name/from-email above, but if
# they hit Reply it goes to this address instead.
brevo.reply-to=${BREVO_REPLY_TO:adminpiratesutm@gmail.com}

# ── Logging ───────────────────────────────────────────────────
logging.level.com.utm.rugbyplanner=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
