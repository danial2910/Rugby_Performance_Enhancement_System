# ============================================================
#  AI-Powered Rugby Diet & Fitness Planner
#  Spring Boot Application Configuration
# ============================================================

# ── Server ───────────────────────────────────────────────────
server.port=8080

# ── MongoDB ──────────────────────────────────────────────────
# Local dev default: make sure MongoDB is running locally on port 27017.
# In production, set the MONGODB_URI environment variable to your
# MongoDB Atlas connection string — do NOT hardcode it here.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rugby_planner_db}
spring.data.mongodb.database=rugby_planner_db

# Enable @CreatedDate / @LastModifiedDate auto-population
spring.data.mongodb.auto-index-creation=true

# ── JWT ───────────────────────────────────────────────────────
# Secret must be at least 256 bits for HS256.
# No real secret is hardcoded here (this file is committed to git).
# Set the JWT_SECRET environment variable — locally on your machine for dev,
# and on the host (e.g. Render) for production.
app.jwt.secret=${JWT_SECRET:}
# Token expiry: 24 hours in milliseconds
app.jwt.expiration-ms=86400000

# ── CORS ─────────────────────────────────────────────────────
# Local dev default covers the Vite dev server (5173) and CRA-style (3000).
# In production, set CORS_ALLOWED_ORIGINS to your deployed frontend URL(s),
# comma-separated, e.g. https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Frontend URL ───────────────────────────────────────────────
# Used to build links inside emails (e.g. the "View My Appointments" button).
# Local dev default points at the Vite dev server. In production, set
# FRONTEND_URL to your deployed Vercel URL, no trailing slash,
# e.g. https://rugby-performance-enhancement-syste.vercel.app
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ── AI Engine ──────────────────────────────────────────────────
# Groq's free, hosted, OpenAI-compatible chat-completions API is used for
# all AI generation (workout plans, meal plans, chatbot) — both locally and
# in production. Get a free API key from https://console.groq.com and set
# it as the GROQ_API_KEY environment variable (locally on your machine for
# dev, and on the host for production). No local model server required.
groq.api.url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:60}

# ── Email (UC010 — appointment notifications via Resend HTTP API) ────────────
# Switched from Gmail SMTP to Resend because free-tier Render web services
# block outbound traffic on SMTP ports (25/465/587) — see Render changelog
# "Free web services will no longer allow outbound traffic to SMTP ports".
# Resend is an HTTPS API, so it isn't affected by that block.
# Sign up free at https://resend.com → API Keys → Create API Key.
# No real key is hardcoded here (this file is committed to git).
# Set RESEND_API_KEY as an environment variable — locally on your machine for
# dev, and on the host (e.g. Render) for production.
resend.api.key=${RESEND_API_KEY:}
resend.api.url=https://api.resend.com/emails
# Sender address. Resend's free tier only allows sending from its shared
# "onboarding@resend.dev" address until you verify your own domain with them.
resend.from-email=${RESEND_FROM_EMAIL:Rugby Performance Enhancement System <onboarding@resend.dev>}
# Reply-To address. Recipients still see "from onboarding@resend.dev", but if
# they hit Reply it goes to this address instead — keeps the original Gmail
# account (adminpiratesutm@gmail.com) in the loop without needing SMTP.
resend.reply-to=${RESEND_REPLY_TO:adminpiratesutm@gmail.com}

# ── Logging ───────────────────────────────────────────────────
logging.level.com.utm.rugbyplanner=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
